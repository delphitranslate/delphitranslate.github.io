<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title description">
  <title id="title">Caution: pre-release development project</title>
  <desc id="description">This project is not ready for production use.</desc>
  <defs>
    <linearGradient id="warningRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#450a0a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="1188" height="208" rx="24" fill="url(#warningRed)" stroke="#450a0a" stroke-width="12"/>
  <rect x="24" y="24" width="1152" height="172" rx="14" fill="none" stroke="#fecaca" stroke-width="3" opacity="0.8"/>

  <g transform="translate(78 42)" filter="url(#shadow)">
    <path d="M68 0 136 124H0Z" fill="#fff" stroke="#450a0a" stroke-width="7" stroke-linejoin="round"/>
    <rect x="61" y="35" width="14" height="50" rx="7" fill="#b91c1c"/>
    <circle cx="68" cy="102" r="9" fill="#b91c1c"/>
  </g>

  <text x="635" y="92" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="6">CAUTION</text>
  <text x="635" y="146" text-anchor="middle" fill="#fff7ed" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="1">PRE-RELEASE DEVELOPMENT PROJECT</text>
  <text x="635" y="181" text-anchor="middle" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">NOT READY FOR PRODUCTION USE</text>
</svg>
