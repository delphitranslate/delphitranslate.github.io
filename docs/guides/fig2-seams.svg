<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="Segoe UI, Arial, sans-serif">
  <!-- 760 units wide for the same reason as figure 1: the drawing is placed at
       the printable width of the page, so a wider drawing means smaller type. -->
  <rect width="760" height="430" fill="#ffffff"/>
  <text x="20" y="32" font-size="20" font-weight="600" fill="#1a3a5c">Figure 2 — Where the tests sit, and the seams between them</text>
  <text x="20" y="56" font-size="14" fill="#555">A value can be correct at both ends of the pipeline and absent in the middle.</text>

  <g font-size="13">
    <rect x="20"  y="85" width="160" height="62" rx="6" fill="#eef4fa" stroke="#1a3a5c"/>
    <text x="100" y="111" text-anchor="middle" font-size="14" font-weight="600" fill="#1a3a5c">Analysis</text>
    <text x="100" y="132" text-anchor="middle" fill="#555">the planner decides</text>

    <rect x="215" y="85" width="160" height="62" rx="6" fill="#eef4fa" stroke="#1a3a5c"/>
    <text x="295" y="111" text-anchor="middle" font-size="14" font-weight="600" fill="#1a3a5c">Proposal file</text>
    <text x="295" y="132" text-anchor="middle" fill="#555">accepted or rejected</text>

    <rect x="410" y="85" width="160" height="62" rx="6" fill="#eef4fa" stroke="#1a3a5c"/>
    <text x="490" y="111" text-anchor="middle" font-size="14" font-weight="600" fill="#1a3a5c">Runtime pack</text>
    <text x="490" y="132" text-anchor="middle" fill="#555">what ships</text>

    <rect x="605" y="85" width="135" height="62" rx="6" fill="#eef4fa" stroke="#1a3a5c"/>
    <text x="672" y="111" text-anchor="middle" font-size="14" font-weight="600" fill="#1a3a5c">Applicator</text>
    <text x="672" y="132" text-anchor="middle" fill="#555">the form changes</text>
  </g>

  <g stroke="#1a3a5c" stroke-width="1.8" fill="none" marker-end="url(#b)">
    <path d="M180 116 H211"/><path d="M375 116 H406"/><path d="M570 116 H601"/>
  </g>
  <defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 z" fill="#1a3a5c"/></marker></defs>

  <g font-size="13">
    <rect x="20" y="215" width="160" height="56" rx="5" fill="#fff8e6" stroke="#9a7b1f"/>
    <text x="100" y="239" text-anchor="middle" font-size="14" font-weight="600" fill="#9a7b1f">64 layout contracts</text>
    <text x="100" y="259" text-anchor="middle" fill="#666">prove the plan</text>

    <rect x="605" y="215" width="135" height="56" rx="5" fill="#fff8e6" stroke="#9a7b1f"/>
    <text x="672" y="239" text-anchor="middle" font-size="14" font-weight="600" fill="#9a7b1f">applicator tests</text>
    <text x="672" y="259" text-anchor="middle" fill="#666">prove the effect</text>

    <rect x="105" y="320" width="240" height="56" rx="5" fill="#e8f2e8" stroke="#2c5f2d"/>
    <text x="225" y="344" text-anchor="middle" font-size="13" font-weight="600" fill="#2c5f2d">ProposalDecisionSmokeTests</text>
    <text x="225" y="364" text-anchor="middle" fill="#666">analysis to proposal, run to run</text>

    <rect x="390" y="320" width="240" height="56" rx="5" fill="#e8f2e8" stroke="#2c5f2d"/>
    <text x="510" y="344" text-anchor="middle" font-size="13" font-weight="600" fill="#2c5f2d">PackLayoutSmokeTests</text>
    <text x="510" y="364" text-anchor="middle" fill="#666">proposal to pack</text>
  </g>

  <g stroke="#9a7b1f" stroke-width="1.4" stroke-dasharray="4 3" fill="none">
    <path d="M100 215 V149"/><path d="M672 215 V149"/>
  </g>
  <g stroke="#2c5f2d" stroke-width="1.4" stroke-dasharray="4 3" fill="none">
    <path d="M225 320 V295 H197 V149"/>
    <path d="M510 320 V295 H540 V149"/>
  </g>
  <text x="20" y="412" font-size="13" fill="#8a1f1f">Tests at the ends pass while the middle is empty. Only a test that crosses a seam can see the hole.</text>
</svg>
