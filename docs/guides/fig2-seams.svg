<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1040" height="400" fill="#ffffff"/>
  <text x="20" y="30" font-size="17" font-weight="600" fill="#1a3a5c">Figure 2 — Where the tests sit, and the seams between them</text>
  <text x="20" y="52" font-size="13" fill="#555">A value can be correct at both ends of the pipeline and absent in the middle. Three defects hid in exactly that gap.</text>

  <g font-size="12.5">
    <rect x="30"  y="90" width="180" height="60" rx="6" fill="#eef4fa" stroke="#1a3a5c"/>
    <text x="120" y="115" text-anchor="middle" font-weight="600" fill="#1a3a5c">Analysis</text>
    <text x="120" y="134" text-anchor="middle" fill="#555">the planner decides</text>

    <rect x="300" y="90" width="180" height="60" rx="6" fill="#eef4fa" stroke="#1a3a5c"/>
    <text x="390" y="115" text-anchor="middle" font-weight="600" fill="#1a3a5c">Proposal file</text>
    <text x="390" y="134" text-anchor="middle" fill="#555">accepted or rejected</text>

    <rect x="570" y="90" width="180" height="60" rx="6" fill="#eef4fa" stroke="#1a3a5c"/>
    <text x="660" y="115" text-anchor="middle" font-weight="600" fill="#1a3a5c">Runtime pack</text>
    <text x="660" y="134" text-anchor="middle" fill="#555">what ships</text>

    <rect x="840" y="90" width="170" height="60" rx="6" fill="#eef4fa" stroke="#1a3a5c"/>
    <text x="925" y="115" text-anchor="middle" font-weight="600" fill="#1a3a5c">Applicator</text>
    <text x="925" y="134" text-anchor="middle" fill="#555">the form changes</text>
  </g>

  <g stroke="#1a3a5c" stroke-width="1.6" fill="none" marker-end="url(#b)">
    <path d="M210 120 H298"/><path d="M480 120 H568"/><path d="M750 120 H838"/>
  </g>
  <defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 z" fill="#1a3a5c"/></marker></defs>

  <g font-size="12">
    <rect x="30" y="200" width="180" height="52" rx="5" fill="#fff8e6" stroke="#9a7b1f"/>
    <text x="120" y="222" text-anchor="middle" font-weight="600" fill="#9a7b1f">54 layout contracts</text>
    <text x="120" y="240" text-anchor="middle" fill="#666">prove the plan</text>

    <rect x="840" y="200" width="170" height="52" rx="5" fill="#fff8e6" stroke="#9a7b1f"/>
    <text x="925" y="222" text-anchor="middle" font-weight="600" fill="#9a7b1f">applicator tests</text>
    <text x="925" y="240" text-anchor="middle" fill="#666">prove the effect</text>

    <rect x="180" y="290" width="230" height="52" rx="5" fill="#e8f2e8" stroke="#2c5f2d"/>
    <text x="295" y="312" text-anchor="middle" font-weight="600" fill="#2c5f2d">ProposalDecisionSmokeTests</text>
    <text x="295" y="330" text-anchor="middle" fill="#666">analysis to proposal, run to run</text>

    <rect x="450" y="290" width="230" height="52" rx="5" fill="#e8f2e8" stroke="#2c5f2d"/>
    <text x="565" y="312" text-anchor="middle" font-weight="600" fill="#2c5f2d">PackLayoutSmokeTests</text>
    <text x="565" y="330" text-anchor="middle" fill="#666">proposal to pack</text>
  </g>

  <g stroke="#9a7b1f" stroke-width="1.3" stroke-dasharray="4 3" fill="none">
    <path d="M120 200 V152"/><path d="M925 200 V152"/>
  </g>
  <g stroke="#2c5f2d" stroke-width="1.3" stroke-dasharray="4 3" fill="none">
    <path d="M295 290 V160 M295 160 H120"/><path d="M565 290 V160 M565 160 H660"/>
  </g>
  <text x="20" y="378" font-size="12" fill="#8a1f1f">Tests at the ends pass while the middle is empty. Only a test that crosses a seam can see the hole.</text>
</svg>
